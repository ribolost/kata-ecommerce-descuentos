<div class="product-grid">
  @for (product of products(); track product.id) {
    <ui-product-card
      class="product-grid__item"
      [product]="product"
      [quantity]="quantityOf(product.id)"
      (increment)="increment.emit(product.id)"
      (decrement)="decrement.emit(product.id)"
    />
  }
</div>
